name: Build & Release EXE

# v1.2.3 형태의 태그 푸시 시 자동 빌드 & GitHub Release 등록
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # Release 생성 + 에셋 업로드 권한

jobs:
  build:
    runs-on: windows-latest   # Windows EXE 빌드

    steps:
      # ── 코드 체크아웃 ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python 설정 ───────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 의존성 설치 ───────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # SAM/PyTorch 제외하고 나머지 설치
          pip install `
            requests anthropic openai google-genai `
            Pillow numpy opencv-python `
            python-dotenv pyyaml loguru `
            pyttsx3 tkinterdnd2 pywin32 `
            pyinstaller

      # ── 버전 태그에서 버전 번호 추출 ────────────────────────────
      - name: Extract version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # ── version.py 버전 번호 업데이트 ───────────────────────────
      - name: Update version.py
        shell: python
        run: |
          import re, pathlib, sys
          # Windows 기본 cp1252 콘솔에서 비ASCII 출력 보호
          try:
              sys.stdout.reconfigure(encoding="utf-8")
          except Exception:
              pass
          ver = "${{ steps.ver.outputs.version }}"
          path = pathlib.Path("version.py")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'__version__\s*=\s*"[^"]+"', f'__version__ = "{ver}"', text)
          path.write_text(text, encoding="utf-8")
          print(f"version.py -> {ver}")

      # ── 변경사항 자동 추출 (이전 태그 ~ 현재 태그) ──────────────
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          # 현재 태그의 직전 태그 찾기
          CURRENT_TAG="${GITHUB_REF_NAME}"
          # tags by version, find one immediately before current
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${CURRENT_TAG}$" | tail -n 1 || true)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            # fallback: 이전 태그 못 찾으면 최근 20개 커밋
            LOG=$(git log --pretty=format:"%s" --max-count=20)
          else
            LOG=$(git log --pretty=format:"%s" "$PREV_TAG..$CURRENT_TAG")
          fi
          # Co-Authored / Merge / 빈 줄 제거 + 'feat: ' / 'fix: ' 등 prefix 정리
          FILTERED=$(echo "$LOG" | grep -v "Co-Authored-By" | grep -v "^Merge " | grep -v "^$")
          # 글머리 기호로 포맷
          BULLETS=$(echo "$FILTERED" | sed 's/^/- /')
          {
            echo 'changes<<RELEASE_EOF'
            echo "$BULLETS"
            echo 'RELEASE_EOF'
          } >> "$GITHUB_OUTPUT"

      # ── PyInstaller 빌드 ──────────────────────────────────────
      - name: Build EXE
        run: pyinstaller gui3.spec --clean --noconfirm

      # ── EXE 이름에 버전 추가 ─────────────────────────────────
      - name: Rename EXE
        shell: bash
        run: |
          mv dist/LUXBOY_ShopEditor.exe dist/LUXBOY_ShopEditor_v${{ steps.ver.outputs.version }}.exe

      # ── GitHub Release 생성 & EXE 업로드 ──────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "LUXBOY Shop Editor ${{ github.ref_name }}"
          body: |
            ## 📋 변경사항
            ${{ steps.notes.outputs.changes }}

            ## 📥 설치 방법
            1. 아래 `LUXBOY_ShopEditor_v*.exe` 를 다운로드
            2. EXE와 같은 폴더에 `.env` 파일 생성 (API 키 입력)
            3. EXE 실행

            기존 사용자는 프로그램 시작 시 자동 업데이트 알림이 표시됩니다.

            ## 📚 전체 히스토리
            [history.md](https://github.com/${{ github.repository }}/blob/main/history.md)
          files: dist/LUXBOY_ShopEditor_v${{ steps.ver.outputs.version }}.exe
          draft: false
          prerelease: false
